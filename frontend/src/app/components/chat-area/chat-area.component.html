<!-- src/app/chat-area/chat-area.component.html -->
<div class="chat-area">
    <!-- Chat header -->
    <div class="chat-header">
      <div *ngIf="chatWithUser" class="user-info">
        <div class="user-avatar">{{ chatWithUser.charAt(0).toUpperCase() }}</div>
        <div class="user-name">{{ chatWithUser }}</div>
      </div>
    </div>
    
    <!-- Messages -->
    <div class="message-container" #messageContainer>
      <div *ngIf="!currentRoom" class="empty-chat">
        <p>Bir sohbet seçin veya yeni bir sohbet başlatın</p>
      </div>
      
      <div *ngFor="let message of messages" 
           class="message" 
           [class.own-message]="message.sender === currentUser">
        <div class="message-bubble">
          {{ message.text }}
          <div class="message-time">{{ formatTime(message.timestamp) }}</div>
        </div>
      </div>
    </div>
    
    <!-- Message input -->
    <div class="message-input" *ngIf="currentRoom">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Mesajınızı yazın..." 
        [(ngModel)]="newMessage" 
        (keyup.enter)="sendMessage()">
      <button class="btn btn-primary send-button" (click)="sendMessage()">
        Gönder
      </button>
    </div>
  </div>
